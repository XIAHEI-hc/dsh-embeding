services:
  workbench:
    build: .
    init: true
    env_file: .env
    environment:
      WORKBENCH_DATA_DIR: /data
    ports:
      - "127.0.0.1:${WORKBENCH_PORT:-8765}:8765"
    volumes:
      - workbench-data:/data
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    mem_limit: 2g
volumes:
  workbench-data:
