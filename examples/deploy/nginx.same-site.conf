# 外层同站点专用域名反代。TLS证书/路径由部署管理员补齐。
# 不改变既有服务端口；UPSTREAM_EXISTING_PORT 替换成现值。
map $http_upgrade $dsh_connection_upgrade { default upgrade; '' close; }
server {
    listen 443 ssl;
    server_name dsh.example.test;
    ssl_certificate /etc/nginx/certs/dsh.fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/dsh.key.pem;
    location / {
        proxy_pass http://127.0.0.1:UPSTREAM_EXISTING_PORT;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Origin $http_origin;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $dsh_connection_upgrade;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
    }
    # frame-ancestors 由受控embed入口产生，避免在这里追加冲突的第二份CSP。
}
