[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dsh-workbench"
version = "0.2.0"
description = "Official DSH Web distribution and Python SDK CLI"
requires-python = ">=3.10"
dependencies = ["deepseek-harness-sdk==0.1.5rc1", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.20,<1", "python-dotenv>=1,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1"]

[project.scripts]
dsh-workbench = "workbench.cli:main"

[tool.setuptools.packages.find]
include = ["workbench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
