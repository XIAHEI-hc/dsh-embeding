<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DSH 工作台</title><link rel="stylesheet" href="/style.css"></head><body>
<header><div><strong>DSH 工作台</strong><span> 独立版 · Python SDK</span></div><div id="health">连接中</div><button id="logout">退出访问</button></header>
<div id="login"><h2>连接你的工作台</h2><p>输入 .env 中配置的 WORKBENCH_TOKEN。模型凭据由服务器管理。</p><input type="password" id="token" placeholder="工作台访问令牌"><button id="connect">连接</button><p id="loginError"></p></div>
<main id="main" hidden><aside><div class="bar"><h3>会话</h3><button id="new">＋ 新建</button></div><div id="sessions"></div><p class="hint">当前版本用于单用户独立部署。每次只执行一个任务。</p></aside><section class="conversation"><div class="bar"><h2 id="title">选择或创建会话</h2><span id="state"></span></div><div id="messages"></div><form id="composer"><textarea id="prompt" placeholder="例如：读取 input/ 下的 CSV，计算统计结果，将报告写到 output/。然后可以继续对话修改。" required></textarea><button id="send">发送任务</button></form><details open><summary>执行事件</summary><pre id="events">暂无事件</pre></details></section><section class="files"><div class="bar"><h3>文件与产物</h3><button id="refreshFiles">刷新</button></div><label class="upload">上传到 input/<input id="upload" type="file"></label><div id="files"></div><label>文件路径<input id="filePath" placeholder="scripts/analyze.py"></label><textarea id="editor" placeholder="选择文本文件查看或编辑；也可以在 scripts/ 下创建新文件。"></textarea><div class="bar"><button id="save">保存修改</button><button id="download">下载文件</button></div><details><summary>最近保存差异</summary><pre id="diff"></pre></details></section></main><div id="notice" role="status"></div><script src="/app.js"></script></body></html>
